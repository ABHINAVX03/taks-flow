spring.application.name=taskflow-api
server.port=8080
server.servlet.context-path=/api/v1

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Let Spring Boot infer driver from the JDBC URL when possible.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# JWT
jwt.secret=${JWT_SECRET:change_this_secret_in_development}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Management
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.taskflow=DEBUG
logging.level.org.springframework.security=WARN

# Debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
